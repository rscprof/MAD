name: Build and Publish LaTeX Document

on:
  push:
    branches:
      - RUT

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Если есть зависимости для generate_latex.py, укажи их здесь
          # pip install -r cw/requirements.txt

      - name: Generate LaTeX
        working-directory: cw
        run: |
          python generate_latex.py

      - name: Compile LaTeX
        working-directory: cw
        run: |
          if [ ! -f output.tex ]; then
            echo "Error: output.tex not found"
            exit 1
          fi

          for i in 1 2 3; do
            pdflatex -interaction=nonstopmode output.tex
          done

          if [ ! -f output.pdf ]; then
            echo "Error: output.pdf not found"
            exit 1
          fi

      - name: Prepare distribution folder
        run: |
          mkdir -p dist/RUT
          cp cw/output.pdf dist/RUT/control.pdf

      - name: Publish to GitHub Pages
        uses: tsunematsu21/actions-publish-gh-pages@v1.0.2
        with:
          dir: dist
          branch: pages
          token: ${{ secrets.ACCESS_TOKEN }}
