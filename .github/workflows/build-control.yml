name: Build LaTeX document from RUT
on:
  push:
    branches:
      - RUT

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-lang-cyrillic

      - name: Generate LaTeX PDF
        shell: bash
        run: |
          cd cw
          python generate_latex.py
          pdflatex -interaction=nonstopmode output.tex

      - name: Prepare dist directory
        shell: bash
        run: |
          mkdir -p dist/RUT
          cp cw/output.pdf dist/RUT/control.pdf

      - name: Publish to GitHub Pages
        uses: tsunematsu21/actions-publish-gh-pages@v1.0.2
        with:
          dir: dist
          branch: pages
          token: ${{ secrets.ACCESS_TOKEN }}
